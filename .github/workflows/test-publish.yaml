name: Test and publish

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'bin/**'
      - 'config/**'
      - 'public/**'
      - 'src/**'
      - '.dockerignore'
      - '.github/workflows/test-publish.yaml'
      - 'composer.*'
      - 'Dockerfile'
      - 'LICENSE'
      - '!config/docker/mcp.dev.json'
      - '!config/docker/php.dev.ini'
      - '!config/reference.php'
  pull_request:
    branches:
      - main
    paths:
      - 'bin/**'
      - 'config/**'
      - 'public/**'
      - 'src/**'
      - '.dockerignore'
      - '.github/workflows/test-publish.yaml'
      - 'composer.*'
      - 'Dockerfile'
      - 'LICENSE'
      - '!config/docker/mcp.dev.json'
      - '!config/docker/php.dev.ini'
      - '!config/reference.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and publish
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔍 Detect PHP version from composer.json
        id: php_ver
        run: |
            VER=$(php -r '$c = json_decode(file_get_contents("composer.json"), true); preg_match("/\d+\.\d+/", $c["config"]["platform"]["php"] ?? $c["require"]["php"] ?? "8.5", $m); echo $m[0];')
            echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php_ver.outputs.version }}
          tools: composer:v2
          coverage: none

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 🎨 Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

      - name: 🔬 Run static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/mailer-mcp-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 🚀 Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frankenphp_prod
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 🌐 Update Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/mailer-mcp-server
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true
