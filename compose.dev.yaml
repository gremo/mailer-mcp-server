services:
    php:
        container_name: '${COMPOSE_PROJECT_NAME}-php'
        build:
            target: frankenphp_dev
            args:
                FRANKENPHP_TAG: php8.5-alpine
        volumes:
            - 'var:/app/var'
            - 'vendor:/app/vendor'
            - './config/docker/php.dev.ini:/usr/local/etc/php/conf.d/30-php.ini'
            - './config/docker/php.ini:/usr/local/etc/php/conf.d/20-php.ini'
            - '.:/app'
        environment:
            APP_ENV: dev
            APP_DEBUG: true
            SERVER_NAME: ':80'
            CADDY_GLOBAL_OPTIONS: debug
            MAILER_DSN: smtp://mailpit:1025
            MAILER_FROM: no-reply@example.com
            TZ: ${TZ:-UTC}
        restart: unless-stopped

    mcp-inspector:
        container_name: '${COMPOSE_PROJECT_NAME}-mcp-inspector'
        image: ghcr.io/modelcontextprotocol/inspector
        command: ["--config", "/config/mcp-servers.json"]
        volumes:
            - ./config/docker/mcp.dev.json:/config/mcp-servers.json
        environment:
            TZ: ${TZ:-UTC}
        ports:
            - "6274:6274"
        restart: unless-stopped

    mailpit:
        container_name: ${COMPOSE_PROJECT_NAME}-mailpit
        image: axllent/mailpit
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: true
            MP_SMTP_AUTH_ALLOW_INSECURE: true
            TZ: ${TZ:-UTC}
        ports:
            - '8025:8025'
        restart: unless-stopped

volumes:
    var:
    vendor:
